<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>16強雙打淘汰賽</title>
  <link rel="stylesheet" href="../css/style.css">
  <script src="https://cdn.jsdelivr.net/npm/lz-string@1.5.0/libs/lz-string.min.js"></script>
  <style>
    /* ===== 樹狀對戰表 (Flexbox Bracket) ===== */
    .bracket-wrap { overflow-x:auto; padding:10px 0; }
    .bracket { display:flex; flex-direction:row; }
    .bracket .round { display:flex; flex-direction:column; justify-content:center; width:170px; list-style:none; padding:0; margin:0; }
    .bracket .round .spacer { flex-grow:1; }
    .bracket .round .spacer:first-child,
    .bracket .round .spacer:last-child { flex-grow:.5; }
    .bracket .round .game-spacer { flex-grow:1; min-height:24px; border-right:2px solid var(--border); }

    .bracket .round li.game { padding:6px 10px; font-size:0.82rem; display:flex; justify-content:space-between; align-items:center; white-space:nowrap; background:var(--surface); }
    .bracket .round li.game-top { border-bottom:2px solid var(--border); border-top:1px solid var(--border); border-left:1px solid var(--border); border-radius:4px 0 0 0; }
    .bracket .round li.game-bottom { border-top:2px solid var(--border); border-bottom:1px solid var(--border); border-left:1px solid var(--border); border-radius:0 0 0 4px; }
    .bracket .round li.game .tname { flex:1; overflow:hidden; text-overflow:ellipsis; color:var(--text-secondary); }
    .bracket .round li.game .tscore { font-weight:800; min-width:20px; text-align:center; margin-left:8px; color:var(--text-secondary); }
    .bracket .round li.game.winner .tname { color:var(--accent); font-weight:700; }
    .bracket .round li.game.winner .tscore { color:var(--accent); }

    /* 輪次標題列 */
    .bracket .round-header { display:flex; flex-direction:column; justify-content:flex-start; width:170px; list-style:none; padding:0; margin:0; }
    .round-label { text-align:center; font-size:0.75rem; font-weight:700; color:var(--accent); letter-spacing:1px; padding-bottom:8px; }

    /* 季軍戰獨立區塊 */
    .third-place-section { margin-top:16px; padding:12px; background:var(--surface); border:1px solid var(--border); border-radius:8px; display:inline-flex; flex-direction:column; font-size:0.82rem; }
    .third-place-section .tp-title { font-size:0.75rem; font-weight:700; color:var(--accent); margin-bottom:6px; text-align:center; }
    .third-place-section .tp-row { display:flex; justify-content:space-between; padding:4px 10px; }
    .third-place-section .tp-row.winner .tname { color:var(--accent); font-weight:700; }
    .third-place-section .tp-row.winner .tscore { color:var(--accent); font-weight:800; }
    .third-place-section .tname { min-width:60px; }
    .third-place-section .tscore { font-weight:700; min-width:20px; text-align:center; margin-left:12px; }

    /* ===== 比賽詳情 ===== */
    .detail-card { margin-top:20px; }
    .match-row { background:var(--surface); border:1px solid var(--border); border-radius:8px; margin-bottom:8px; overflow:hidden; }
    .match-row-header { display:flex; align-items:center; justify-content:center; gap:12px; padding:12px 16px; cursor:pointer; transition:background 0.15s; }
    .match-row-header:hover { background:rgba(255,255,255,0.03); }
    .match-row-header .team { font-weight:600; min-width:60px; }
    .match-row-header .team.left { text-align:right; }
    .match-row-header .team.right { text-align:left; }
    .match-row-header .winner { color:var(--accent); }
    .match-row-header .loser { color:var(--text-muted); }
    .match-row-header .score-box { display:flex; gap:4px; align-items:center; font-size:1.3rem; font-weight:800; }
    .match-row-header .score-box .divider { color:var(--text-muted); font-size:1rem; }
    .match-row-header .toggle-arrow { color:var(--text-muted); font-size:0.7rem; margin-left:8px; }
    .match-row-body { padding:10px 16px 14px; border-top:1px solid var(--border); }
    .match-row-body .players { display:flex; justify-content:center; gap:20px; font-size:0.85rem; color:var(--text-secondary); margin-bottom:10px; }
    .match-row-body .games-list { display:flex; justify-content:center; gap:8px; flex-wrap:wrap; }
    .game-badge { background:var(--bg); border:1px solid var(--border); border-radius:4px; padding:3px 8px; font-size:0.8rem; font-weight:600; }
    .game-badge .gw { color:var(--accent); }
    .game-badge .gl { color:var(--text-muted); }
  </style>
</head>
<body>

  <header class="site-header">
    <div class="container">
      <h1 id="tournamentTitle">16強雙打淘汰賽</h1>
      <div class="header-meta">
        <span id="tournamentDate"></span>
        <span id="tournamentLocation"></span>
      </div>
    </div>
  </header>

  <nav class="nav-bar">
    <div class="container">
      <ul>
        <li><a href="#" class="nav-link active" data-section="rules">賽事規則</a></li>
        <li><a href="#" class="nav-link" data-section="bracket">對戰表</a></li>
        <li><a href="#" class="nav-link" data-section="detail">比賽詳情</a></li>
      </ul>
    </div>
  </nav>

  <main class="container">
    <section class="section active" id="sec-rules">
      <div class="section-title"><span class="icon">R</span> 賽事規則</div>
      <div class="card">
        <div id="rulesContent"><p class="empty-state">尚未設定比賽規則</p></div>
      </div>
    </section>

    <section class="section" id="sec-bracket">
      <div class="section-title"><span class="icon">B</span> 對戰表</div>
      <div class="card" style="overflow-x:auto;">
        <div id="bracketContainer"></div>
      </div>
    </section>

    <section class="section" id="sec-detail">
      <div class="section-title"><span class="icon">D</span> 比賽詳情</div>
      <div id="detailContainer"></div>
    </section>
  </main>

  <footer class="site-footer">
    <div class="container">16強雙打淘汰賽管理系統</div>
  </footer>

  <div class="toast" id="toast"></div>

  <script src="js/demo-data.js?v=2"></script>
  <script src="js/storage.js?v=2"></script>
  <script src="js/view.js?v=2"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>管理後台 - 乒乓球錦標賽</title>
  <link rel="stylesheet" href="css/style.css">
  <script src="https://cdn.jsdelivr.net/npm/lz-string@1.5.0/libs/lz-string.min.js"></script>
</head>
<body>

  <div class="admin-banner">管理模式 - 編輯比賽資料</div>

  <header class="site-header">
    <div class="container">
      <h1 id="adminTitle">乒乓球錦標賽 - 管理後台</h1>
    </div>
  </header>

  <nav class="nav-bar">
    <div class="container">
      <ul>
        <li><button class="nav-link active" data-section="settings">賽事設定</button></li>
        <li><button class="nav-link" data-section="teams">隊伍管理</button></li>
        <li><button class="nav-link" data-section="groups">小組賽</button></li>
        <li><button class="nav-link" data-section="groupmatches">小組比賽</button></li>
        <li><button class="nav-link" data-section="knockout">淘汰賽</button></li>
        <li><button class="nav-link" data-section="share">分享</button></li>
      </ul>
    </div>
  </nav>

  <main class="container">

    <!-- Settings Section -->
    <section class="section active" id="sec-settings">
      <div class="section-title"><span class="icon">S</span> 賽事設定</div>
      <div class="card">
        <div class="form-group">
          <label>比賽名稱</label>
          <input type="text" class="form-control" id="inputName" placeholder="例如：2026 乒乓球錦標賽">
        </div>
        <div class="form-row">
          <div class="form-group">
            <label>日期</label>
            <input type="text" class="form-control" id="inputDate" placeholder="例如：2026年2月4日-8日">
          </div>
          <div class="form-group">
            <label>地點</label>
            <input type="text" class="form-control" id="inputLocation" placeholder="例如：台北體育館">
          </div>
        </div>
        <div class="form-row">
          <div class="form-group">
            <label>小組賽賽制</label>
            <select class="form-control" id="inputGroupFormat">
              <option value="三局兩勝">三局兩勝</option>
              <option value="五局三勝" selected>五局三勝</option>
              <option value="七局四勝">七局四勝</option>
            </select>
          </div>
          <div class="form-group">
            <label>淘汰賽賽制</label>
            <select class="form-control" id="inputKnockoutFormat">
              <option value="五局三勝">五局三勝</option>
              <option value="七局四勝" selected>七局四勝</option>
            </select>
          </div>
        </div>
        <div class="form-group">
          <label>比賽規則</label>
          <textarea class="form-control" id="inputRules" rows="8" placeholder="輸入比賽規則說明..."></textarea>
        </div>
        <button class="btn btn-primary" id="btnSaveSettings">儲存設定</button>
      </div>
    </section>

    <!-- Teams Section -->
    <section class="section" id="sec-teams">
      <div class="section-title"><span class="icon">T</span> 隊伍管理 <span class="badge badge-accent" id="teamCount">0 / 10</span></div>
      <div class="card">
        <div class="form-group" style="display:flex;gap:8px;">
          <input type="text" class="form-control" id="inputTeamName" placeholder="輸入隊伍名稱" style="flex:1;">
          <button class="btn btn-primary" id="btnAddTeam">新增隊伍</button>
        </div>
        <div class="team-list" id="teamList"></div>
      </div>
    </section>

    <!-- Groups Section -->
    <section class="section" id="sec-groups">
      <div class="section-title"><span class="icon">G</span> 小組分組</div>
      <div class="card">
        <div class="form-group" style="display:flex;gap:8px;align-items:flex-end;">
          <div style="flex:1;">
            <label>小組數量</label>
            <select class="form-control" id="inputGroupCount">
              <option value="2">2 組</option>
              <option value="3">3 組</option>
              <option value="4">4 組</option>
            </select>
          </div>
          <div style="flex:1;">
            <label>每組晉級人數</label>
            <select class="form-control" id="inputAdvanceCount">
              <option value="1">每組 1 隊</option>
              <option value="2" selected>每組 2 隊</option>
              <option value="3">每組 3 隊</option>
            </select>
          </div>
          <button class="btn btn-warning" id="btnAutoGroup">自動分組</button>
        </div>
      </div>
      <div class="group-config" id="groupConfig"></div>
      <div style="margin-top:12px;">
        <button class="btn btn-success" id="btnSaveGroups">儲存分組並產生賽程</button>
      </div>
    </section>

    <!-- Group Matches Section -->
    <section class="section" id="sec-groupmatches">
      <div class="section-title"><span class="icon">M</span> 小組比賽成績</div>
      <div id="groupMatchesContainer"></div>
    </section>

    <!-- Knockout Section -->
    <section class="section" id="sec-knockout">
      <div class="section-title"><span class="icon">K</span> 淘汰賽</div>
      <div class="card">
        <div class="btn-group" style="margin-bottom:16px;">
          <button class="btn btn-primary" id="btnAddRound">新增輪次</button>
          <button class="btn btn-warning" id="btnAutoKnockout">自動產生淘汰賽</button>
        </div>
      </div>
      <div id="knockoutRoundsContainer"></div>
    </section>

    <!-- Share Section -->
    <section class="section" id="sec-share">
      <div class="section-title"><span class="icon">S</span> 分享連結</div>
      <div class="card">
        <div class="card-title">觀看連結</div>
        <p style="color:var(--text-secondary);font-size:0.9rem;margin-bottom:12px;">
          將此連結分享給觀眾，他們可以查看比賽規則和成績。
        </p>
        <div class="share-url-box">
          <input type="text" class="share-url-input" id="viewUrl" readonly>
          <button class="btn btn-primary" id="btnCopyView">複製</button>
        </div>
      </div>
      <div class="card">
        <div class="card-title">管理連結</div>
        <p style="color:var(--text-secondary);font-size:0.9rem;margin-bottom:12px;">
          此連結可用來編輯比賽資料，請妥善保管。
        </p>
        <div class="share-url-box">
          <input type="text" class="share-url-input" id="adminUrl" readonly>
          <button class="btn btn-primary" id="btnCopyAdmin">複製</button>
        </div>
      </div>
      <div class="card">
        <div class="card-title">匯出 / 匯入資料</div>
        <div class="btn-group">
          <button class="btn btn-outline" id="btnExport">匯出 JSON</button>
          <button class="btn btn-outline" id="btnImport">匯入 JSON</button>
        </div>
        <input type="file" id="fileImport" accept=".json" style="display:none;">
      </div>
      <div class="card">
        <div class="card-title">重置資料</div>
        <p style="color:var(--text-secondary);font-size:0.9rem;margin-bottom:12px;">
          清除所有比賽資料，此操作無法復原。
        </p>
        <button class="btn btn-danger" id="btnReset">重置所有資料</button>
      </div>
      <div class="card">
        <div class="card-title">載入測試資料</div>
        <p style="color:var(--text-secondary);font-size:0.9rem;margin-bottom:12px;">
          載入 10 隊完整測試資料（含選手名單與比賽結果），用於預覽網站效果。
        </p>
        <button class="btn btn-warning" id="btnLoadDemo">載入測試資料</button>
      </div>
    </section>

  </main>

  <footer class="site-footer">
    <div class="container">乒乓球錦標賽管理系統</div>
  </footer>

  <div class="toast" id="toast"></div>

  <script src="js/demo-data.js?v=4"></script>
  <script src="js/storage.js?v=4"></script>
  <script src="js/admin.js?v=4"></script>
</body>
</html>
